name: backend-release-smoke

on:
  push:
    paths:
      - "Backend-AI/**"
      - ".github/workflows/backend_release_smoke.yml"
  pull_request:
    paths:
      - "Backend-AI/**"
      - ".github/workflows/backend_release_smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend-AI
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (compileall)
        run: |
          python -m compileall -q .

      - name: Release smoke (pytest)
        run: |
          pytest -q tests/test_release_smoke_e2e.py

      - name: Chaos smoke (220x)
        run: |
          python scripts/ci_smoke_chaos.py --loops 220 --frames 8 --fail-rate 0.05 --max-retries 3 --jitter-ms 50
